name: Build Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install . pyinstaller

      - name: Build CLCE
        run: python -m PyInstaller --clean --onefile --console --name clce --paths src --collect-all prompt_toolkit --collect-all pygments build_clce.py

      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist\clce.exe -DestinationPath clce-windows-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: clce-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
